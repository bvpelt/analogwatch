name: 🐛 Bug Report
description: Report something that is broken
labels: [bug]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Short description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to...
        2. Click...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Ubuntu 24.04, Chrome, Garmin Epix Gen 2

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web (Angular)
        - Backend (Spring Boot)
        - Garmin Device
        - CI/CD     

  - type: input
    id: device
    attributes:
      label: Garmin Device Model
      placeholder: e.g. Forerunner 165, Fenix 7, Epix Gen 2         
