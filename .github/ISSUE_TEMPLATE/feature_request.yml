name: ✨ Feature Request
description: Suggest a new idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
      placeholder: |
        I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: Describe your ideal solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Small (1-2 days)
        - Medium (1 week)
        - Large (multiple weeks)

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Affects many users
        - label: Performance improvement
        - label: Developer experience

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web (Angular)
        - Backend (Spring Boot)
        - Garmin Device
        - CI/CD